<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Write-it — Écris 100 mots par jour">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Write-it</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1 class="logo">Write-it</h1>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn" title="Paramètres" aria-label="Paramètres">⚙️</button>
      </div>
    </header>

    <!-- Views -->
    <main id="main">
      <!-- DASHBOARD -->
      <section id="view-dashboard" class="view active">
        <div class="dashboard">
          <div class="progress-card">
            <p class="date-label" id="today-date"></p>
            <div class="word-count" id="dashboard-count">
              <span class="count-number">0</span>
              <span class="count-target">/ 100 mots</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p class="status-text" id="status-text">Commence à écrire aujourd'hui</p>
          </div>

          <div class="streak-card" id="streak-card">
            <span class="streak-icon">🔥</span>
            <span id="streak-count">0</span> jour<span id="streak-plural">s</span> d'affilée
          </div>

          <button id="btn-write" class="btn btn-primary btn-large">
            Écrire
          </button>

          <div class="dashboard-actions">
            <button id="btn-history" class="btn btn-secondary btn-dashboard">
              Historique
            </button>
            <button id="btn-edition" class="btn btn-secondary btn-dashboard">
              Édition
            </button>
          </div>
        </div>
      </section>

      <!-- WRITE -->
      <section id="view-write" class="view">
        <div class="write-header">
          <button id="btn-back-write" class="icon-btn">←</button>
          <div class="write-counter" id="write-counter">
            <span id="live-count">0</span> / 100 mots
          </div>
          <div class="write-actions">
            <button id="btn-save-write" class="icon-btn" title="Sauvegarder">💾</button>
          </div>
        </div>
        
        <textarea 
          id="editor" 
          placeholder="Écris librement ici... (minimum 100 mots)"
          maxlength="12000"
          spellcheck="true"
        ></textarea>
        
        <div class="write-footer">
          <span id="max-hint">Maximum 2000 mots</span>
          <span id="save-status"></span>
        </div>
      </section>

      <!-- HISTORY -->
      <section id="view-history" class="view">
        <div class="history-header">
          <button id="btn-back-history" class="icon-btn">←</button>
          <h2>Historique</h2>
        </div>
        <div id="history-list" class="history-list">
          <!-- Filled by JS -->
        </div>
      </section>

      <!-- EDITION (reorder + preview) -->
      <section id="view-edition" class="view">
        <div class="history-header">
          <button id="btn-back-edition" class="icon-btn">←</button>
          <h2>Édition</h2>
        </div>
        <p class="edition-hint">Maintiens appuyé puis glisse pour réordonner</p>
        <div id="edition-list" class="history-list edition-list">
          <!-- Filled by JS -->
        </div>
      </section>

      <!-- EDIT NOTE -->
      <section id="view-edit" class="view">
        <div class="write-header">
          <button id="btn-back-edit" class="icon-btn">←</button>
          <div class="write-counter" id="edit-date-label"></div>
          <div class="write-actions">
            <button id="btn-save-edit" class="icon-btn" title="Sauvegarder">💾</button>
          </div>
        </div>
        
        <textarea id="edit-editor" spellcheck="true"></textarea>
        
        <div class="write-footer">
          <span id="edit-word-count">0 mots</span>
          <span id="edit-save-status"></span>
        </div>
      </section>

      <!-- SETTINGS -->
      <section id="view-settings" class="view">
        <div class="history-header">
          <button id="btn-back-settings" class="icon-btn">←</button>
          <h2>Paramètres</h2>
        </div>
        
        <div class="settings-content">
          <div class="setting-item">
            <label>Notifications</label>
            <p class="setting-desc">Rappel quotidien à 18h00</p>
            <button id="btn-enable-notif" class="btn btn-secondary btn-small">Activer les notifications</button>
            <p id="notif-status" class="setting-status"></p>
          </div>

          <div class="setting-item">
            <label>Données</label>
            <p class="setting-desc">Tout est stocké localement sur ton appareil.</p>
            <button id="btn-export" class="btn btn-secondary btn-small">Exporter les données</button>
          </div>

          <div class="setting-item danger">
            <label>Zone de danger</label>
            <button id="btn-reset" class="btn btn-danger btn-small">Réinitialiser l'application</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
